app:
  name: LakanVault
  log_level: INFO

cloud:
  enabled: false

local:
  chunk_size_bytes: 1048576
  models_dir: ./data/models
  manifest_db: ./data/manifest.db
  audit_dir: ./data/audit

pipeline:
  order: [integrity, threat_scanner, privacy, audit]

privacy:
  enabled: true

local_ai:
  base_url: http://localhost:1234
  model: ""
  timeout_seconds: 120
  temperature: 0.7
  max_tokens: 256
  stream: true
  provider: lm_studio
  presets:
    lm_studio: http://localhost:1234
    ollama: http://localhost:11434
    llama_cpp: http://localhost:8080
