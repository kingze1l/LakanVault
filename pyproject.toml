[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lakanvault"
version = "0.1.0"
description = "Hybrid, locally deployable AI security gateway"
requires-python = ">=3.12"
dependencies = [
    "presidio-analyzer>=2.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",  # async OpenAI reverse-proxy client (verified TLS)
    "pystray>=0.19.0",
    "pillow>=10.0.0",
]

[project.scripts]
lakanvault = "lakanvault.launcher.bootstrap:main"
lakanvault-mcp = "lakanvault.mcp.stdio_proxy:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
packaging = [
    "pyinstaller>=6.0.0",
]
ner = [
    "spacy>=3.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
