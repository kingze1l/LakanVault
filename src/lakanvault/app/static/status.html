<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LakanVault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0b0e14;
      --navy-2: #11151d;
      --surface: #161b24;
      --surface-2: #1c222d;
      --line: rgba(255,255,255,.08);
      --line-2: rgba(255,255,255,.14);
      --text: #e8eaed;
      --muted: #8b92a5;
      --dim: #5c6370;
      --green: #3e704d;
      --green-bright: #5a9e6f;
      --green-soft: rgba(62,112,77,.18);
      --warn: #c4a035;
      --err: #d45a5a;
      --mask: #6b8cae;
      --sans: "IBM Plex Sans", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: var(--sans);
      background: var(--navy);
      color: var(--text);
      user-select: none;
    }
    .screen {
      height: 100%; display: none; flex-direction: column;
      padding: 0.7rem 0.75rem 0.75rem;
      gap: 0.55rem;
      background:
        linear-gradient(180deg, #10151c 0%, var(--navy) 42%);
    }
    .screen.active { display: flex; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: baseline; gap: 0.45rem; min-width: 0; }
    .brand strong {
      font-size: 0.88rem; font-weight: 700; letter-spacing: -0.03em;
      color: var(--text);
    }
    .brand em {
      font-style: normal; font-size: 0.68rem; color: var(--dim);
      font-family: var(--mono); font-weight: 500;
    }
    .header-right { display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0; }
    .icon-btn {
      appearance: none;
      width: 1.55rem; height: 1.55rem;
      padding: 0; margin: 0;
      border: 1px solid var(--line-2);
      background: var(--surface);
      color: var(--muted);
      border-radius: 2px;
      font: inherit; font-size: 0.95rem; line-height: 1;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { color: var(--text); border-color: rgba(255,255,255,.22); background: var(--surface-2); }
    .chip {
      font-family: var(--mono);
      font-size: 0.62rem; font-weight: 600; letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.18rem 0.42rem;
      border: 1px solid var(--line-2);
      background: var(--surface);
      color: var(--green-bright);
    }
    .chip.off { color: var(--warn); border-color: rgba(196,160,53,.35); }
    .chip.block { color: #f0a0a0; border-color: rgba(212,90,90,.4); }
    .chip.mask, .chip.warn { color: #e6c96a; border-color: rgba(196,160,53,.35); }
    .strip {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.5rem; font-size: 0.78rem;
      padding: 0.4rem 0;
      color: var(--muted);
    }
    .strip b { color: var(--text); font-weight: 600; }
    .metrics {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1px; background: var(--line);
      border: 1px solid var(--line);
    }
    .metric {
      background: var(--surface);
      padding: 0.55rem 0.4rem 0.5rem;
      text-align: left;
    }
    .metric .n {
      font-family: var(--mono);
      font-size: 1.2rem; font-weight: 600; line-height: 1;
      letter-spacing: -0.03em;
    }
    .metric .l {
      margin-top: 0.28rem;
      font-size: 0.58rem; color: var(--dim);
      letter-spacing: 0.08em; font-weight: 600;
    }
    .metric.block .n { color: var(--err); }
    .metric.warn .n { color: var(--warn); }
    .metric.mask .n { color: var(--mask); }
    .section-label {
      font-family: var(--mono);
      font-size: 0.58rem; color: var(--dim); font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; margin: 0.15rem 0 0;
    }
    .activity-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 0.28rem; }
    ul {
      list-style: none; margin: 0; padding: 0;
      border: 1px solid var(--line); background: var(--surface);
      overflow: auto; flex: 1;
    }
    li {
      display: grid; grid-template-columns: 3.2rem 1fr auto;
      gap: 0.45rem; align-items: center;
      padding: 0.42rem 0.55rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.74rem;
    }
    li:last-child { border-bottom: none; }
    li.row { cursor: pointer; }
    li.row:hover { background: var(--surface-2); }
    .act {
      font-family: var(--mono);
      font-size: 0.58rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .act.block { color: var(--err); }
    .act.warn { color: var(--warn); }
    .act.mask { color: var(--mask); }
    .meta {
      font-family: var(--mono);
      color: var(--dim); font-size: 0.62rem; text-align: right; line-height: 1.3;
    }
    .types { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .empty { color: var(--dim); padding: 0.75rem 0.65rem; font-size: 0.76rem; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
    .actions.triple { grid-template-columns: 1fr 1fr 1fr; }
    button {
      appearance: none;
      border: 1px solid var(--line-2);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 2px;
      padding: 0.48rem 0.4rem;
      font: inherit; font-size: 0.74rem; font-weight: 600;
      cursor: pointer;
    }
    button.primary {
      background: var(--green-soft);
      border-color: rgba(90,158,111,.45);
      color: #b7e6d2;
    }
    button.danger {
      background: rgba(212,90,90,.12);
      border-color: rgba(212,90,90,.4);
      color: #f0b0b0;
    }
    button.ghost {
      background: transparent; border-color: transparent;
      color: var(--muted); text-decoration: underline; text-underline-offset: 2px;
    }
    button:disabled { opacity: 0.38; cursor: not-allowed; }
    button:hover:not(:disabled) { border-color: rgba(255,255,255,.22); }
    button.primary:hover:not(:disabled) { background: rgba(62,112,77,.28); }
    .back {
      border: 0; background: transparent; color: var(--muted);
      font-family: var(--mono); font-size: 0.66rem; font-weight: 500;
      padding: 0; cursor: pointer; text-align: left; letter-spacing: 0.02em;
    }
    .back:hover { color: var(--text); }
    .hl {
      font-family: var(--mono); font-size: 0.7rem;
      white-space: pre-wrap; word-break: break-word; line-height: 1.45;
      max-height: 92px; overflow: auto; user-select: text;
      background: var(--navy-2); border: 1px solid var(--line);
      padding: 0.5rem 0.55rem; border-radius: 2px;
    }
    mark {
      background: rgba(196,160,53,.28); color: inherit;
      border-radius: 0; padding: 0 1px;
    }
    mark.block { background: rgba(212,90,90,.35); }
    mark.mask { background: rgba(62,112,77,.35); color: #cfe8d6; }
    .pair {
      display: grid; grid-template-columns: 1fr; gap: 0.45rem;
      flex: 1; min-height: 0; overflow: auto;
    }
    .pair label {
      font-family: var(--mono);
      font-size: 0.58rem; color: var(--dim); font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      margin: 0 0 0.2rem; display: block;
    }
    .status-msg { color: var(--muted); font-size: 0.7rem; min-height: 1em; font-family: var(--mono); }
    .status-msg.err { color: #f0a0a0; }
    #overrideBox {
      display: none; padding: 0.55rem 0.6rem;
      border: 1px solid rgba(212,90,90,.4);
      background: rgba(212,90,90,.08);
      flex-direction: column; gap: 0.4rem; border-radius: 2px;
    }
    #overrideBox.visible { display: flex; }
    #overrideBox p { margin: 0; font-size: 0.72rem; line-height: 1.4; color: var(--text); }
    #overrideBox label.check {
      display: flex; gap: 0.4rem; align-items: flex-start;
      font-size: 0.72rem; cursor: pointer; color: var(--muted);
    }
  </style>
</head>
<body>
  <section class="screen active" id="screen-status">
    <header>
      <div class="brand">
        <strong>LakanVault</strong>
        <em>local</em>
      </div>
      <div class="header-right">
        <span id="protection-pill" class="chip">on</span>
        <button type="button" class="icon-btn" id="btn-minimize" title="Minimize" aria-label="Minimize">−</button>
      </div>
    </header>
    <div class="strip">
      <span id="protection-label"><b>Protection</b> active</span>
      <span id="protection-hint">counts only</span>
    </div>
    <div class="metrics">
      <div class="metric block"><div class="n" id="n-block">0</div><div class="l">BLOCKED</div></div>
      <div class="metric warn"><div class="n" id="n-warn">0</div><div class="l">WARNED</div></div>
      <div class="metric mask"><div class="n" id="n-mask">0</div><div class="l">MASKED</div></div>
    </div>
    <div class="activity-wrap">
      <p class="section-label">activity · select to review</p>
      <ul id="activity"><li class="empty">No protect events yet.</li></ul>
    </div>
    <div class="actions">
      <button type="button" class="primary" id="btn-open-review">Review</button>
      <button type="button" id="btn-pause">Pause</button>
    </div>
  </section>

  <section class="screen" id="screen-review">
    <header>
      <div class="brand" style="flex-direction:column;gap:0.15rem;align-items:flex-start">
        <button type="button" class="back" id="btn-back">← status</button>
        <strong>Prompt Review</strong>
      </div>
      <div class="header-right">
        <span class="chip" id="review-verdict">—</span>
        <button type="button" class="icon-btn" id="btn-minimize-review" title="Minimize" aria-label="Minimize">−</button>
      </div>
    </header>
    <div class="pair">
      <div>
        <label>Original</label>
        <div class="hl" id="originalHl">(none)</div>
      </div>
      <div>
        <label>Filtered</label>
        <div class="hl" id="sanitized">(none)</div>
      </div>
    </div>
    <p class="status-msg" id="review-status"></p>
    <div id="overrideBox">
      <p id="overrideWarn">This will send unmasked content outside your device. This cannot be undone.</p>
      <label class="check">
        <input type="checkbox" id="overrideAck" />
        <span>I understand this exposes real credentials or PII.</span>
      </label>
      <div class="actions">
        <button type="button" class="danger" id="btn-confirm-override" disabled>Confirm unmasked</button>
        <button type="button" id="btn-cancel-override">Cancel</button>
      </div>
    </div>
    <div class="actions triple" id="review-actions">
      <button type="button" class="primary" id="btn-send" disabled>Send filtered</button>
      <button type="button" class="ghost" id="btn-override" disabled>Override</button>
      <button type="button" id="btn-back-2">Back</button>
    </div>
  </section>

  <script>
    const el = (id) => document.getElementById(id);
    let paused = false;
    let reviewState = {
      sessionId: "", sanitized: "", original: "", action: "allow",
      allowSend: false, findings: [],
    };

    function showScreen(name) {
      document.querySelectorAll(".screen").forEach((n) => n.classList.remove("active"));
      el("screen-" + name).classList.add("active");
    }

    function fmtTime(ts) {
      try {
        return new Date(ts * 1000).toLocaleTimeString([], {
          hour: "2-digit", minute: "2-digit", second: "2-digit"
        });
      } catch { return ""; }
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function highlight(text, findings) {
      const spans = (findings || [])
        .map((f) => ({ start: f.start, end: f.end, action: f.action || "" }))
        .filter((f) => f.end > f.start)
        .sort((a, b) => a.start - b.start);
      let out = "", cursor = 0;
      for (const span of spans) {
        if (span.start < cursor) continue;
        out += escapeHtml(text.slice(cursor, span.start));
        const cls = span.action === "block" ? "block" : "mask";
        out += `<mark class="${cls}">` + escapeHtml(text.slice(span.start, span.end)) + "</mark>";
        cursor = span.end;
      }
      return out + escapeHtml(text.slice(cursor));
    }

    function friendlyError(msg) {
      const s = String(msg || "");
      if (/cannot reach local llm|local llm is not running|connection refused|failed to establish|urlerror/i.test(s)) {
        return "Local LLM offline — start LM Studio/Ollama on :1234, then retry Send or Override.";
      }
      return s;
    }

    function minimizeFlyout() {
      try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.minimize_flyout) {
          window.pywebview.api.minimize_flyout();
          return;
        }
      } catch (_) {}
    }

    function setReviewStatus(msg, isErr) {
      const node = el("review-status");
      node.textContent = isErr ? friendlyError(msg) : (msg || "");
      node.className = "status-msg" + (isErr ? " err" : "");
    }

    function hideOverride() {
      el("overrideBox").classList.remove("visible");
      el("overrideAck").checked = false;
      el("btn-confirm-override").disabled = true;
      el("review-actions").style.display = "grid";
    }

    function applyReview(data) {
      const original = data.original || "";
      reviewState = {
        sessionId: data.session_id || "",
        sanitized: data.sanitized || "",
        original,
        action: data.final_action || "allow",
        allowSend: !!data.allow_send,
        findings: data.findings || [],
      };
      const v = el("review-verdict");
      v.textContent = reviewState.action;
      v.className = "chip " + reviewState.action;
      el("originalHl").innerHTML = original
        ? highlight(original, reviewState.findings)
        : "(none)";
      el("sanitized").textContent = reviewState.sanitized || "(empty — blocked)";
      el("btn-send").disabled = !reviewState.allowSend;
      el("btn-override").disabled = !reviewState.sessionId;
      hideOverride();
      setReviewStatus(
        reviewState.allowSend
          ? "Ready — send filtered to local LLM."
          : "Blocked — override sends unmasked once."
      );
      showScreen("review");
    }

    async function openEvent(eventId) {
      if (!eventId) return;
      setReviewStatus("Loading…");
      showScreen("review");
      try {
        const resp = await fetch("/api/protect/event/" + encodeURIComponent(eventId));
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || resp.statusText);
        applyReview(data);
      } catch (err) {
        setReviewStatus(String(err.message || err), true);
      }
    }

    function openEmptyReview() {
      reviewState = {
        sessionId: "", sanitized: "", original: "", action: "allow",
        allowSend: false, findings: [],
      };
      el("review-verdict").textContent = "—";
      el("review-verdict").className = "chip";
      el("originalHl").textContent = "Select an activity row, or use toast View after a protect hit.";
      el("sanitized").textContent = "(none)";
      el("btn-send").disabled = true;
      el("btn-override").disabled = true;
      hideOverride();
      setReviewStatus("No event loaded.");
      showScreen("review");
    }

    function render(stats) {
      paused = !!stats.paused;
      el("n-block").textContent = String(stats.blocked ?? 0);
      el("n-warn").textContent = String(stats.warned ?? 0);
      el("n-mask").textContent = String(stats.masked ?? 0);
      el("protection-label").innerHTML = paused
        ? "<b>Protection</b> paused"
        : "<b>Protection</b> active";
      el("protection-hint").textContent = paused ? "toasts off" : "counts only";
      const pill = el("protection-pill");
      pill.textContent = paused ? "paused" : "on";
      pill.className = "chip" + (paused ? " off" : "");
      el("btn-pause").textContent = paused ? "Resume" : "Pause";

      const activity = stats.activity || [];
      const list = el("activity");
      if (!activity.length) {
        list.innerHTML = '<li class="empty">No protect events yet.</li>';
        return;
      }
      list.innerHTML = activity.map((e) => {
        const types = (e.entity_types || []).slice(0, 4).join(", ") || "—";
        const id = Number(e.id) || 0;
        return `<li class="row" data-event="${id}" title="Review in tray">
          <span class="act ${e.action}">${e.action}</span>
          <span class="types" title="${types}">${types}</span>
          <span class="meta">${e.source}<br/>${fmtTime(e.ts)}</span>
        </li>`;
      }).join("");
      list.querySelectorAll("li.row").forEach((node) => {
        node.addEventListener("click", () => openEvent(node.getAttribute("data-event")));
      });
    }

    async function refresh() {
      try {
        const resp = await fetch("/api/protect/stats");
        if (!resp.ok) return;
        render(await resp.json());
      } catch (_) {}
    }

    async function sendPayload(override) {
      if (!reviewState.sessionId) return;
      setReviewStatus(override ? "Sending unmasked…" : "Sending filtered…");
      try {
        const body = {
          session_id: reviewState.sessionId,
          sanitized: reviewState.sanitized,
          override: !!override,
          base_url: "http://127.0.0.1:1234",
        };
        const resp = await fetch("/api/review/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(typeof data.detail === "string" ? data.detail : resp.statusText);
        if (data.blocked) {
          setReviewStatus(data.block_reason || "Blocked", true);
          return;
        }
        if (data.error) {
          setReviewStatus(data.error, true);
          return;
        }
        hideOverride();
        const tag = data.override_used ? "override" : "filtered";
        setReviewStatus("Sent (" + tag + ") · " + (data.model_used || "model"));
      } catch (err) {
        setReviewStatus(String(err.message || err), true);
      }
    }

    el("btn-minimize").addEventListener("click", minimizeFlyout);
    el("btn-minimize-review").addEventListener("click", minimizeFlyout);
    el("btn-pause").addEventListener("click", async () => {
      try {
        const resp = await fetch("/api/protect/pause", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ paused: !paused }),
        });
        if (resp.ok) render(await (await fetch("/api/protect/stats")).json());
      } catch (_) {}
    });
    el("btn-open-review").addEventListener("click", openEmptyReview);
    el("btn-back").addEventListener("click", () => showScreen("status"));
    el("btn-back-2").addEventListener("click", () => showScreen("status"));
    el("btn-send").addEventListener("click", () => sendPayload(false));
    el("btn-override").addEventListener("click", () => {
      const types = [...new Set((reviewState.findings || []).map((f) => f.entity_type).filter(Boolean))]
        .slice(0, 4).join(", ") || "sensitive content";
      el("overrideWarn").textContent =
        "This will send unmasked content (" + types + ") outside your device. This cannot be undone.";
      el("overrideBox").classList.add("visible");
      el("review-actions").style.display = "none";
    });
    el("overrideAck").addEventListener("change", () => {
      el("btn-confirm-override").disabled = !el("overrideAck").checked;
    });
    el("btn-confirm-override").addEventListener("click", () => sendPayload(true));
    el("btn-cancel-override").addEventListener("click", hideOverride);

    const params = new URLSearchParams(location.search);
    const eventParam = params.get("event");
    const panel = params.get("panel");
    if (eventParam) openEvent(eventParam);
    else if (panel === "review") openEmptyReview();

    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape") minimizeFlyout();
    });

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
